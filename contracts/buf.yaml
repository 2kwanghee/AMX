version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The design SSOT (§4) fixes the layout as contracts/proto/amx.proto, so the
    # directory does not mirror the `amx.v1` package.
    - PACKAGE_DIRECTORY_MATCH
    # Request/response types are shared across RPCs by design (the Session stream
    # carries AmaMessage / AmsCommand, not per-RPC wrappers).
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
    # The service name is fixed by the design SSOT (§5.4 sketch).
    - SERVICE_SUFFIX
breaking:
  use:
    - FILE
  except:
    # go_package is a Go source-path option, not wire format. The generated Go
    # is committed in-repo and its module path is owned by this monorepo, so
    # path renames (e.g. the placeholder → real-repo fix) are allowed.
    - FILE_SAME_GO_PACKAGE
    # AmsCommand reserves 17-29 as planned command-expansion slots. Promoting a
    # slot to a real oneof arm (e.g. 17 → SetPolicy, P3/O4-C) shrinks the reserved
    # range, which this rule flags — but the number was never a live field, so the
    # wire stays compatible. Consuming a documented expansion slot is intended.
    - RESERVED_MESSAGE_NO_DELETE
