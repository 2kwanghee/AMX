version: v2

# Go stubs. Requires protoc-gen-go and protoc-gen-go-grpc on PATH
# (`go install`, see contracts/gen/README.md).
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt:
      # Output lands directly in gen/go, matching the module path declared by
      # `option go_package` and the go.mod there.
      - paths=source_relative

  - local: protoc-gen-go-grpc
    out: gen/go
    opt:
      - paths=source_relative
